<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#77639F;
  --bg-deep:#5f4f83;
  --surface:#8977AC;
  --surface2:#9a8abb;
  --accent:#F0B34D;
  --accent-dim:#c99640;
  --cream:#FBF8F4;
  --muted:#DCD3EC;
  --muted-dim:#c3b6dc;
  --teal:#3FC1E0;
  --urgent:#FF6B5B;
  --scheduled:#F0B34D;
  --ongoing:#4CAF7D;
  --radius:14px;
  --radius-lg:18px;
  --shell-max:1180px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:linear-gradient(160deg, #6f5c96 0%, #5f4f83 55%, #4f4173 100%);
  background-attachment:fixed;
  color:var(--cream);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  letter-spacing:0;
}
h1,h2,h3{font-weight:700;margin:0;color:var(--cream);letter-spacing:-0.01em;font-family:'Space Grotesk',sans-serif;}
p{margin:0;color:var(--muted);}
button{font-family:inherit;cursor:pointer;border:none;letter-spacing:0;}
a{color:inherit;}
svg{display:block;}

/* ---------- APP SHELL (mobile-first, desktop enhanced) ---------- */
#appShell{display:flex;min-height:100vh;width:100%;max-width:1600px;margin:0 auto;background:var(--bg);}
#sidenav{
  display:none;flex-direction:column;width:240px;flex-shrink:0;
  background:var(--bg-deep);padding:24px 16px;gap:6px;position:sticky;top:0;height:100vh;
}
#app{flex:1;max-width:640px;margin:0 auto;position:relative;background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}

@media (min-width:900px){
  #sidenav.show{display:flex;}
  #app{max-width:none;border-left:1px solid rgba(255,255,255,0.06);}
  .screen{padding-left:48px;padding-right:48px;}
  .hero-wrap{max-width:620px;}
  .grid-row{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
  .fab{right:44px !important;left:auto !important;transform:none !important;}
  .fab:active{transform:scale(0.92) !important;}
}
@media (min-width:1300px){
  .screen{padding-left:72px;padding-right:72px;}
}

/* ---------- MEGA HERO (animated gradient, centered logo, scroll-revealed CTAs) ---------- */
.mega-hero{
  position:relative;min-height:100vh;width:100%;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:var(--bg-deep);flex-shrink:0;padding:0 24px;
}
.blob{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;}
.blob1{width:62vw;height:62vw;max-width:640px;max-height:640px;background:#6D3EC9;top:-12%;left:-14%;opacity:0.85;animation:blobMove1 17s ease-in-out infinite;}
.blob2{width:56vw;height:56vw;max-width:580px;max-height:580px;background:#F0743D;top:22%;right:-12%;opacity:0.8;animation:blobMove2 21s ease-in-out infinite;}
.blob3{width:50vw;height:50vw;max-width:520px;max-height:520px;background:#F0B34D;bottom:-18%;left:22%;opacity:0.75;animation:blobMove3 19s ease-in-out infinite;}
@keyframes blobMove1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(6%,8%) scale(1.12);}}
@keyframes blobMove2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-8%,-4%) scale(1.15);}}
@keyframes blobMove3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(5%,-8%) scale(1.1);}}

.hero-logo-big{width:min(70vw,460px) !important;}

.hero-typewriter{
  position:relative;z-index:2;font-size:clamp(16px,2.6vw,24px);color:var(--cream);font-weight:600;
  min-height:1.4em;text-align:center;max-width:600px;
}
.tw-cursor{display:inline-block;color:var(--accent);font-weight:700;animation:twBlink .8s step-end infinite;margin-left:2px;}
@keyframes twBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

.stat-row{display:flex;justify-content:center;gap:56px;flex-wrap:wrap;}
.stat-block{text-align:center;}

.hero-logo-pulse{
  position:relative;z-index:2;width:min(52vw,320px);
  filter:drop-shadow(0 14px 44px rgba(0,0,0,0.4));
  animation:logoPulse 4.2s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.3;transform:scale(0.93);}
}

.scroll-hint{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cream);opacity:0.6;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  animation:scrollBounce 1.8s ease-in-out infinite;
}
.scroll-hint svg{transform:rotate(-90deg);}
@keyframes scrollBounce{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,8px);}}

.reveal-ctas{opacity:0;transform:translateY(50px);transition:opacity .7s ease-out, transform .7s cubic-bezier(.2,.8,.2,1);}
.reveal-ctas.in-view{opacity:1;transform:translateY(0);}

.mega-btn-row{display:flex;flex-direction:column;gap:20px;margin-top:32px;max-width:900px;margin-left:auto;margin-right:auto;}
@media (min-width:700px){ .mega-btn-row{flex-direction:row;} }

.mega-btn{
  position:relative;overflow:hidden;flex:1;padding:32px 30px;border-radius:24px;
  transition:transform .28s cubic-bezier(.2,.8,.25,1.3), box-shadow .28s ease;
  display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
}
.mega-btn-title{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:10px;font-size:21px;font-weight:800;}
.mega-btn-sub{position:relative;z-index:2;font-size:13px;font-weight:500;opacity:0.8;line-height:1.4;max-width:280px;}
.mega-btn::before{
  content:'';position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .35s ease;
  background:linear-gradient(120deg, rgba(109,62,201,0.5), rgba(240,116,61,0.45), rgba(240,179,77,0.5));
  background-size:220% 220%;animation:miniGradient 6s ease infinite;
}
@keyframes miniGradient{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.mega-btn-primary{background:var(--accent);color:#3a2018;box-shadow:0 8px 24px rgba(240,179,77,0.3);}
.mega-btn-outline{background:rgba(255,255,255,0.04);border:2px solid var(--accent);color:var(--accent);}
@media (hover:hover){
  .mega-btn:hover{transform:translateY(-6px) scale(1.015); box-shadow:0 20px 40px rgba(20,10,40,0.4);}
  .mega-btn:hover::before{opacity:0.55;}
}


/* ---------- LANDING HERO (real desktop layout, not a stretched phone) ---------- */
.landing-h1{font-size:clamp(28px,4vw,42px);line-height:1.12;}
.landing-cta-row{display:flex;flex-direction:column;gap:12px;margin-top:30px;}
.landing-cta-row .btn-primary,.landing-cta-row .btn-outline{width:100%;}
.landing-hero{display:flex;flex-direction:column;gap:20px;}
.hero-visual{display:none;}
@media (min-width:900px){
  .landing-hero{flex-direction:row;align-items:center;gap:48px;}
  .landing-hero .hero-wrap{flex:0 0 auto;width:440px;}
  .landing-cta-row{flex-direction:row;}
  .landing-cta-row .btn-primary,.landing-cta-row .btn-outline{width:auto;flex:1;}
  .hero-visual{
    display:flex;flex:1;min-height:340px;position:relative;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 30%, rgba(240,179,77,0.16), transparent 60%),
               radial-gradient(circle at 75% 70%, rgba(78,158,143,0.14), transparent 55%);
    border-radius:28px;overflow:hidden;
  }
  .hero-visual-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle, rgba(240,179,77,0.25), transparent 70%);filter:blur(10px);top:10%;left:8%;animation:floatGlow 6s ease-in-out infinite;}
  @keyframes floatGlow{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}
  .hero-visual-glyph{position:absolute;bottom:24px;left:28px;width:64px;opacity:0.5;}
  .hero-visual-card{
    position:relative;width:280px;background:var(--surface);border-radius:20px;padding:20px;
    box-shadow:0 20px 50px rgba(15,8,30,0.4);border:1px solid rgba(255,255,255,0.08);
    animation:cardFloat 5s ease-in-out infinite;
  }
  @keyframes cardFloat{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-10px) rotate(0.5deg);}}
}


.sidenav-logo{display:flex;align-items:center;gap:8px;padding:6px 10px 22px 10px;}
.sidenav-logo img{width:34px;height:34px;object-fit:contain;}
.sidenav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;background:none;text-align:left;width:100%;
}
.sidenav-item svg{width:20px;height:20px;flex-shrink:0;}
.sidenav-item.active{background:var(--surface);color:var(--accent);}
.sidenav-item:hover{color:var(--cream);}

.btn-primary{
  background:var(--accent);color:#3a2018;font-weight:700;padding:15px 20px;border-radius:var(--radius);
  font-size:16px;width:100%;transition:transform .15s ease-out, box-shadow .15s ease-out;
  box-shadow:0 4px 14px rgba(240,179,77,0.25);display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.45;}
.btn-outline{
  background:transparent;border:2px solid var(--accent);color:var(--accent);font-weight:700;
  padding:13px 20px;border-radius:var(--radius);font-size:16px;width:100%;transition:transform .15s ease-out, background .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-outline:active{transform:scale(0.97);}
.btn-ghost{background:transparent;color:var(--muted);font-weight:600;padding:8px;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{color:var(--cream);}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{color:var(--cream);}

.screen{padding:22px 20px 100px 20px;animation:fadeSlideIn .25s ease-out;flex:1;display:flex;flex-direction:column;}
.screen.zoom-in{animation:zoomIn .3s cubic-bezier(.2,.8,.2,1);}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes zoomIn{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}

.card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;box-shadow:0 4px 18px rgba(20,10,40,0.18);}

/* top bar shared across screens */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand img{height:28px;object-fit:contain;}

/* ---------- LOADING TRANSITION OVERLAY ---------- */
.route-loading{
  position:fixed;inset:0;background:var(--bg-deep);z-index:200;display:flex;align-items:center;justify-content:center;
  animation:routeFade .28s ease-out;
}
@keyframes routeFade{from{opacity:0;}to{opacity:1;}}
.route-loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,179,77,0.25);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Splash ---------- */
.splash{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.splash img{width:150px;object-fit:contain;animation:logoPop .6s cubic-bezier(.2,.9,.3,1.2);}
@keyframes logoPop{from{opacity:0;transform:scale(0.7);}to{opacity:1;transform:scale(1);}}

/* progress dots */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);transition:background .3s, width .3s;}
.dot.active{background:var(--accent);width:22px;border-radius:5px;}

/* chips */
.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
.interest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px;}
@media (min-width:600px){.interest-grid{grid-template-columns:repeat(3,1fr);}}
.interest-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px 16px;
  background:var(--surface);border-radius:var(--radius-lg);border:2px solid transparent;
  font-weight:700;font-size:14px;color:var(--cream);transition:transform .18s ease-out, border-color .2s, background .2s;
}
.interest-icon{width:40px;height:40px;border-radius:12px;background:rgba(240,179,77,0.14);color:var(--accent);display:flex;align-items:center;justify-content:center;}
.interest-card.selected{border-color:var(--accent);background:rgba(240,179,77,0.12);transform:scale(1.03);}
.interest-card.selected .interest-icon{background:var(--accent);color:#3a2018;}
.chip{padding:10px 16px;border-radius:20px;background:var(--surface);color:var(--cream);border:2px solid transparent;font-weight:600;font-size:14px;transition:transform .15s ease-out, background .2s;}
.chip.selected{background:var(--accent);color:#3a2018;transform:scale(1.05);}

/* bottom nav (mobile) */
.bottomnav{position:sticky;bottom:0;left:0;right:0;background:var(--bg-deep);display:flex;justify-content:space-around;padding:9px 0 12px 0;border-top:1px solid rgba(255,255,255,0.08);}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;background:none;padding:4px 10px;position:relative;}
.navitem svg{width:21px;height:21px;}
.navitem.active{color:var(--accent);}
.navitem.active::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:16px;height:3px;background:var(--accent);border-radius:2px;}
@media (min-width:900px){.bottomnav{display:none;}}

/* request/event card */
/* ---------- HOVER / MICRO-INTERACTION SYSTEM ---------- */
@media (hover:hover){
  .btn-primary{transition:transform .18s cubic-bezier(.2,.8,.3,1.4), box-shadow .2s ease, filter .2s ease;}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(240,179,77,0.4); filter:brightness(1.06);}
  .btn-outline{transition:transform .18s cubic-bezier(.2,.8,.3,1.4), background .2s ease, box-shadow .2s ease;}
  .btn-outline:hover{transform:translateY(-2px); background:rgba(240,179,77,0.1); box-shadow:0 6px 18px rgba(240,179,77,0.15);}
  .btn-ghost{transition:color .15s ease, transform .15s ease;}
  .btn-ghost:hover{color:var(--cream); transform:translateX(2px);}
  .icon-btn,.gear-btn,.evt-loc-btn,.social-btn{transition:transform .18s cubic-bezier(.2,.8,.3,1.4), background .2s ease, color .2s ease;}
  .icon-btn:hover,.gear-btn:hover,.evt-loc-btn:hover,.social-btn:hover{transform:translateY(-2px) scale(1.06); background:var(--accent); color:#3a2018;}
  .req-card{transition:transform .22s cubic-bezier(.2,.8,.3,1.3), box-shadow .22s ease, border-color .22s ease;}
  .req-card:hover{transform:translateY(-4px); box-shadow:0 12px 28px rgba(20,10,35,0.28); border-color:rgba(240,179,77,0.35);}
  .event-banner{transition:transform .22s cubic-bezier(.2,.8,.3,1.3), box-shadow .22s ease;}
  .event-banner:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(20,10,35,0.3);}
  .event-row,.org-row,.inv-row{transition:transform .18s ease, background .2s ease;}
  .event-row:hover,.org-row:hover,.inv-row:hover{transform:translateX(3px); background:var(--surface2);}
  .chip{transition:transform .18s cubic-bezier(.3,.6,.3,1.6), background .18s ease;}
  .chip:hover{transform:translateY(-2px) scale(1.04);}
  .filter-pill{transition:transform .15s ease, border-color .2s ease;}
  .filter-pill:hover{transform:translateY(-1px); border-color:var(--muted-dim);}
  .give-card,.taptarget{transition:transform .2s cubic-bezier(.2,.8,.3,1.3), border-color .2s ease, box-shadow .2s ease;}
  .give-card:hover,.taptarget:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 20px rgba(20,10,35,0.2);}
  .sidenav-item{transition:transform .15s ease, background .2s ease, color .2s ease;}
  .sidenav-item:hover{transform:translateX(4px);}
  .navitem{transition:transform .15s ease, color .2s ease;}
  .navitem:hover{transform:translateY(-2px);}
  .fab{transition:transform .22s cubic-bezier(.3,.6,.3,1.6), box-shadow .22s ease;}
  .fab:hover{transform:scale(1.08); box-shadow:0 10px 26px rgba(240,179,77,0.55);}
  .partner-chip{transition:transform .2s ease, background .2s ease;}
  .partner-chip:hover{transform:translateY(-3px); background:var(--surface2);}
  .cta-help{transition:transform .18s ease, filter .18s ease;}
  .cta-help:hover{transform:translateY(-2px); filter:brightness(1.08);}
  input[type=text]:hover,textarea:hover{border-color:var(--muted-dim);}
  .expand-toggle{transition:gap .2s ease;}
  .expand-toggle:hover{gap:8px;}
}

.req-card{min-width:220px;background:var(--surface);border-radius:var(--radius-lg);padding:14px;flex-shrink:0;transition:transform .15s ease-out;border:1px solid rgba(255,255,255,0.06);box-shadow:0 6px 20px rgba(20,10,40,0.22);position:relative;overflow:hidden;}
.req-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--muted-dim);}
.req-card.u-urgent::before{background:var(--urgent);}
.req-card.u-scheduled::before{background:var(--scheduled);}
.req-card.u-ongoing::before{background:var(--ongoing);}
.req-card.surplus::before{background:var(--teal);}
.req-card:active{transform:scale(0.97);}
.req-card.surplus{border-color:var(--teal);}
.scroll-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.scroll-row::-webkit-scrollbar{display:none;}
.grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.grid-row>*, .scroll-row>*, .events-scroll>*{animation:cardPop .38s cubic-bezier(.2,.8,.3,1.2) both;}
.grid-row>*:nth-child(1),.scroll-row>*:nth-child(1),.events-scroll>*:nth-child(1){animation-delay:.02s;}
.grid-row>*:nth-child(2),.scroll-row>*:nth-child(2),.events-scroll>*:nth-child(2){animation-delay:.07s;}
.grid-row>*:nth-child(3),.scroll-row>*:nth-child(3),.events-scroll>*:nth-child(3){animation-delay:.12s;}
.grid-row>*:nth-child(4),.scroll-row>*:nth-child(4),.events-scroll>*:nth-child(4){animation-delay:.17s;}
.grid-row>*:nth-child(5),.scroll-row>*:nth-child(5){animation-delay:.22s;}
.grid-row>*:nth-child(6),.scroll-row>*:nth-child(6){animation-delay:.27s;}
@keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.org-name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--cream);}
.check{color:var(--accent);width:13px;height:13px;flex-shrink:0;}
.progress-bar{height:8px;background:rgba(255,255,255,0.12);border-radius:6px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease-out;}
.progress-fill.teal{background:var(--teal);}

/* urgency tags: red/orange/green */
.utag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase;}
.utag.urgent{background:var(--urgent);color:#420f08;}
.utag.scheduled{background:var(--scheduled);color:#3a2018;}
.utag.ongoing{background:var(--ongoing);color:#082818;}
.utag.surplus{background:var(--teal);color:#052733;}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin:24px 0 10px 0;display:flex;justify-content:space-between;align-items:center;}
.see-all{color:var(--accent);font-size:12px;font-weight:700;}

/* sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(30,20,45,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:150;animation:fadeIn .2s ease-out;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 30px 20px;animation:slideUp .28s ease-out;max-height:88vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px;margin:20px 0;}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#3a2018;font-size:22px;font-weight:800;}
.stepper .val{font-size:32px;font-weight:800;min-width:50px;text-align:center;}

function haversineMiles(lat1,lng1,lat2,lng2){
  const R = 3958.8;
  const dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function liveDistance(item){
  if(!item.lat) return "nearby";
  const origin = state.userLoc || HQ; // sensible default so it never shows a broken "— mi"
  const mi = haversineMiles(origin.lat, origin.lng, item.lat, item.lng);
  return mi<0.1 ? "< 0.1 mi" : mi.toFixed(1)+" mi";
}
function requestRealLocation(){
  if(state.locStatus!=="idle" || !("geolocation" in navigator)) return;
  state.locStatus="requesting";
  navigator.geolocation.getCurrentPosition(
    (pos)=>{ setState({userLoc:{lat:pos.coords.latitude,lng:pos.coords.longitude}, locStatus:"granted"}); },
    ()=>{ setState({locStatus:"denied"}); },
    {timeout:6000}
  );
}

// Real geocoding via OpenStreetMap Nominatim, constrained to California so
// "Dublin" resolves to Dublin, CA rather than Dublin, Ireland.
async function geocodeLocation(query){
  if(!query || !query.trim()) return null;
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&viewbox=-124.5,42.1,-114.0,32.4&bounded=1&q=${encodeURIComponent(query)}`;
    const resp = await fetch(url, {headers:{"Accept":"application/json"}});
    const data = await resp.json();
    if(data && data[0]) return {lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon), label:data[0].display_name};
  }catch(err){ console.error("Geocoding failed:", err); }
  return null;
}

// Animates the map preview zooming from a statewide California view down to
// the resolved point, by stepping the embedded OSM iframe through shrinking
// bounding boxes.
function animateMapZoom(lat, lng){
  const wrap = document.getElementById("zoomMapPreview");
  if(!wrap) return;
  wrap.innerHTML = `<iframe id="zoomIframe" loading="lazy"></iframe>`;
  const iframe = document.getElementById("zoomIframe");
  const steps = [3.5, 1.6, 0.6, 0.18, 0.05];
  let i = 0;
  function step(){
    const live = document.getElementById("zoomIframe");
    if(!live) return; // user navigated away mid-animation
    const d = steps[i];
    const bbox = `${lng-d}%2C${lat-d}%2C${lng+d}%2C${lat+d}`;
    live.src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lng}`;
    i++;
    if(i<steps.length) setTimeout(step, 500);
  }
  step();
}

function setState(patch){ state = {...state, ...patch}; render(); }

function goTo(screen, opts={}){
  const push = opts.push !== false;
  if(push && state.screen!==screen) state.navHistory.push(state.screen);
  setState({screen, ...opts.extra});
}
function goBack(fallback="feed"){
  const prev = state.navHistory.pop();
  setState({screen: prev || fallback});
}

function showToast(msg, ms=3200){
  setState({toast:{msg}});
  setTimeout(()=>{ if(state.toast && state.toast.msg===msg) setState({toast:null}); }, ms);
}

function withRouteTransition(fn){
  state.routeLoading = true;
  render();
  setTimeout(()=>{ state.routeLoading=false; fn(); }, 260);
}

// ---------- RENDER CORE ----------
function render(){
  const shell = document.getElementById('appShell');
  const app = document.getElementById('app');
  const sidenav = document.getElementById('sidenav');

  const preAuthScreens = ["splash","landing","nameEntry","onboard","orgonboard","orgAbout"];
  const showNav = !preAuthScreens.includes(state.screen);
  sidenav.className = showNav ? "show" : "";
  sidenav.innerHTML = showNav ? sidenavHtml(state.screen) : "";

  let html = "";
  if(state.screen==="splash") html = renderSplash();
  else if(state.screen==="landing") html = renderLanding();
  else if(state.screen==="nameEntry") html = renderNameEntry();
  else if(state.screen==="onboard") html = renderOnboard();
  else if(state.screen==="feed") html = renderFeed();
  else if(state.screen==="browse") html = renderBrowse();
  else if(state.screen==="impact") html = renderImpact();
  else if(state.screen==="profile") html = renderProfile();
  else if(state.screen==="orgdash") html = renderOrgDash();
  else if(state.screen==="orgonboard") html = renderOrgOnboard();
  else if(state.screen==="orgAbout") html = renderOrgAbout();
  else if(state.screen==="scan") html = renderScan();
  else if(state.screen==="events") html = renderEvents();
  else if(state.screen==="orgProfile") html = renderOrgProfile();
  else if(state.screen==="chat") html = renderChat();
  else if(state.screen==="mapView") html = renderMapView();
  else if(state.screen==="postRequest") html = renderPostRequest();
  else if(state.screen==="helpFlow") html = renderHelpFlow();

  if(showNav){
    html += (state.mode==="org" ? orgBottomNav(state.screen) : bottomNav(state.screen));
  }

  let overlay = "";
  if(state.sheetOpen) overlay += renderDonationSheet();
  if(state.traceOpen) overlay += renderTracePanel();
  if(state.eventFilterSheetOpen) overlay += renderEventFilterSheet();
  if(state.settingsOpen) overlay += renderSettingsSheet();
  if(state.financeSheetOpen) overlay += renderFinanceSheet();
  if(state.pledgeListOpen) overlay += renderPledgeListSheet();
  if(state.toast) overlay += `<div class="toast">${iconWrap('check',15,'var(--accent)')} ${state.toast.msg}</div>`;
  if(state.routeLoading) overlay += `<div class="route-loading"><div class="spin"></div></div>`;

  app.innerHTML = html + overlay;
  attachHandlers();

  if(state.traceOpen && !state.traceConcise && state.traceVisible < traceLog.length){
    setTimeout(()=>{ setState({traceVisible: state.traceVisible+1}); }, 650);
  }
}

function filteredEvents(){

// ---------- AUTO-CATEGORIZATION ----------
function autoCategorize(text){
  const t = text.toLowerCase();
  const map = [
    ["Food", ["apple","banana","fruit","bread","canned","soup","rice","pasta","produce","food","snack","milk","cereal","vegetable","meat","grocery","water bottle","loaves"]],
    ["Shelter", ["coat","blanket","jacket","clothes","clothing","tent","sleeping bag","shoe","sock","pillow"]],
    ["Education", ["backpack","school","book","supplies","laptop","pencil","notebook","binder","calculator"]],
    ["Health", ["first aid","medicine","health","hygiene","mask","bandage","toothpaste","soap","diaper"]],
  ];
  for(const [cat, keywords] of map){ if(keywords.some(k=>t.includes(k))) return cat; }
  return "Food";
}

  const remaining = r.need - r.have;

// ---------- REAL AI VISION SCAN + BEST-MATCH SCORING ----------
async function runScanAnalysis(dataUrl, mimeType){
  if(state.apiKey && state.apiKey.trim().length > 10){
    try{
      const base64 = dataUrl.split(",")[1];
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":state.apiKey.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6", max_tokens:300,
          messages:[{role:"user", content:[
            {type:"image", source:{type:"base64", media_type:mimeType, data:base64}},
            {type:"text", text:"Identify the donation item in this photo and, if a quantity is printed on the box/label, extract it. Respond with ONLY raw JSON: {\"item\":\"short item name\",\"qty\":number,\"unit\":\"unit word\",\"category\":\"Food|Shelter|Education|Health\"}. If quantity isn't visible, estimate 1."}
          ]}]
        })
      });
      const data = await resp.json();
      const textBlock = (data.content||[]).find(b=>b.type==="text");
      if(!textBlock) throw new Error("No text in response");
      const parsed = JSON.parse(textBlock.text.replace(/```json|```/g,"").trim());
      setState({scanStage:"result", scanResult:parsed, aiStatus:"live"});
      computeBestMatch(parsed);
      return;
    }catch(err){
      console.error("Live vision call failed, falling back to mock:", err);
      setState({scanError:"Live scan failed — showing a best-effort guess instead."});
    }
  }
  setTimeout(()=>{
    const guesses = [
      {item:"Canned soup", qty:12, unit:"cans", category:"Food"},
      {item:"Bottled water", qty:24, unit:"bottles", category:"Food"},
      {item:"Winter coats", qty:3, unit:"coats", category:"Shelter"},
      {item:"Cereal boxes", qty:8, unit:"boxes", category:"Food"},
    ];
    const guess = guesses[Math.floor(Math.random()*guesses.length)];
    setState({scanStage:"result", scanResult:{...guess}});
    computeBestMatch(guess);
  }, 1200);
}

function computeBestMatch(result){
  const category = (result.category||"").toLowerCase();
  let best=null, bestScore=-1;
  requests.forEach(r=>{
    const remaining = r.need - r.have;
    if(remaining<=0) return;
    const distMi = state.userLoc && r.lat ? haversineMiles(state.userLoc.lat,state.userLoc.lng,r.lat,r.lng) : 5;
    const catMatch = category && r.category.toLowerCase()===category ? 1 : 0.3;
    const urgencyBoost = r.urgency==="urgent" ? 0.25 : 0;
    const distScore = Math.max(0, 1-(distMi/15));
    const score = catMatch*0.45 + distScore*0.3 + urgencyBoost;
    if(score>bestScore){ bestScore=score; best={...r, distMi, score}; }
  });
  if(best) state.bestMatch = {...best, pct: Math.round(Math.min(99, bestScore*100))};
}

// ---------- TARGETED (non-flicker) UI updates ----------
function updateBrowseResults(){
  const container = document.getElementById("browseResultsWrap");
  if(!container) return;
  const results = filteredRequests();
  container.innerHTML = results.length
    ? `<div class="grid-row">${results.map(reqCardHtml).join("")}</div>`
    : `<div class="empty-state">${icon('search',44)}<p>Nothing matches "${state.browseSearch || state.browseFilter}" yet.</p><button class="btn-outline" data-act="clear-browse-filters">Clear filters</button></div>`;
  container.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click", e=>handleAction(el.getAttribute("data-act"), el.getAttribute("data-val"), el));
  });
}

// ---------- HANDLERS ----------
function attachHandlers(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const act = el.getAttribute("data-act");
      const val = el.getAttribute("data-val");
      // Visible press confirmation on every actionable element. Most actions trigger a
      // synchronous re-render that would otherwise destroy this element before the
      // browser ever paints the animation, so we let it paint first, then act.
      el.classList.add("confirm-pop");
      setTimeout(()=>{ handleAction(act, val, el); }, 110);
    });
  });

  const counterNum = document.getElementById("counterNum");
  const counterNum2 = document.getElementById("counterNum2");
  function startCounter(){
    if(counterNum && !counterNum.dataset.counted){
      counterNum.dataset.counted = "1";
      let target=12480, cur=0;
      const step=()=>{ cur+=Math.ceil(target/40); if(cur>=target)cur=target; counterNum.textContent=cur.toLocaleString(); if(cur<target) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }
    if(counterNum2 && !counterNum2.dataset.counted){
      counterNum2.dataset.counted = "1";
      let target2=20, cur2=0;
      const step2=()=>{ cur2+=1; if(cur2>=target2)cur2=target2; counterNum2.textContent=cur2+"+"; if(cur2<target2) setTimeout(step2,45); };
      step2();
    }
  }

  const heroTwText = document.getElementById("heroTwText");
  if(heroTwText && !heroTwText.dataset.typed){
    heroTwText.dataset.typed = "1";
    const text = "Connecting people to those who can help.";
    let i = 0;
    const typeStep = ()=>{
      const live = document.getElementById("heroTwText");
      if(!live) return;
      live.textContent = text.slice(0,i);
      i++;
      if(i<=text.length) setTimeout(typeStep, 40);
      else{ const c=document.getElementById("heroTwCursor"); if(c) c.style.display="none"; }
    };
    setTimeout(typeStep, 900);
  }

  const revealEl = document.getElementById("revealCtas");
  if(revealEl && !revealEl.dataset.observed){
    revealEl.dataset.observed = "1";
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          revealEl.classList.add("in-view");
          startCounter();
          obs.unobserve(en.target);
        }
      });
    }, {threshold:0.25});
    obs.observe(revealEl);
  }

  const scrollHint = document.getElementById("scrollHint");
  if(scrollHint){
    scrollHint.addEventListener("click", ()=>{
      const target = document.getElementById("revealCtas");
      if(target) target.scrollIntoView({behavior:"smooth", block:"center"});
    });
  }

  const cameraFile = document.getElementById("cameraFile");
  if(cameraFile){
    cameraFile.addEventListener("change", (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{ setState({scanStage:"analyzing", scanImage:ev.target.result, scanError:null}); runScanAnalysis(ev.target.result, file.type||"image/jpeg"); };
      reader.readAsDataURL(file);
    });
  }

  const helpFlowFile = document.getElementById("helpFlowFile");
  if(helpFlowFile){
    helpFlowFile.addEventListener("change", (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{ setState({helpFlowImage:ev.target.result}); };
      reader.readAsDataURL(file);
    });
  }

  const distSlider = document.getElementById("distSlider");
  if(distSlider){
    distSlider.addEventListener("input", e=>{ state.eventFilters={...state.eventFilters, maxDistance:parseInt(e.target.value)}; });
    distSlider.addEventListener("change", e=>{ setState({eventFilters:{...state.eventFilters, maxDistance:parseInt(e.target.value)}}); });
  }

  const apiKeyInput = document.getElementById("apiKeyInput");
  if(apiKeyInput) apiKeyInput.addEventListener("input", e=>{ state.apiKey = e.target.value; });

  const locInput = document.getElementById("locInput");
  if(locInput){
    const doGeocode = async (val)=>{
      if(!val.trim()) return;
      setState({location:val, geocodeStatus:"searching", geocodedLoc:null});
      const result = await geocodeLocation(val);
      if(result){
        state.geocodedLoc = result;
        state.geocodeStatus = "found";
        state.userLoc = {lat:result.lat, lng:result.lng};
        render();
        setTimeout(()=>animateMapZoom(result.lat, result.lng), 50);
        showToast("Found it — using this location for distances");
      } else {
        setState({geocodeStatus:"notfound"});
        showToast("Couldn't find that in California — try a nearby city name");
      }
    };
    locInput.addEventListener("blur", e=>doGeocode(e.target.value));
    locInput.addEventListener("keyup", e=>{ if(e.key==="Enter"){ e.target.blur(); doGeocode(e.target.value); } });
  }

  const nameInput = document.getElementById("nameEntryInput");
  if(nameInput) nameInput.addEventListener("input", e=>{ state.userName = e.target.value; });

  const orgAboutInput = document.getElementById("orgAboutInput");
  if(orgAboutInput){
    orgAboutInput.addEventListener("input", e=>{
      let words = e.target.value.trim().split(/\s+/).filter(Boolean);
      if(words.length > 30){
        words = words.slice(0,30);
        e.target.value = words.join(" ");
      }
      state.orgAboutText = e.target.value;
      const lbl = document.getElementById("wordCountLabel");
      if(lbl){ lbl.textContent = `(${e.target.value.trim()?words.length:0}/30 words)`; lbl.style.color = "var(--muted)"; }
    });
  }
  const orgEmailInput = document.getElementById("orgEmailInput");
  if(orgEmailInput) orgEmailInput.addEventListener("input", e=>{ state.orgEmail = e.target.value; });
  const orgPhoneInput = document.getElementById("orgPhoneInput");
  if(orgPhoneInput) orgPhoneInput.addEventListener("input", e=>{ state.orgPhone = e.target.value; });

  // search bar: targeted update, no focus loss
  const searchInput = document.getElementById("browseSearchInput");
  if(searchInput){
    searchInput.addEventListener("input", e=>{ state.browseSearch = e.target.value; updateBrowseResults(); });
  }

  // chat input + enter-to-send
  const chatInput = document.getElementById("chatInput");
  if(chatInput){
    chatInput.addEventListener("input", e=>{ state.chatDraft = e.target.value; });
    chatInput.addEventListener("keyup", e=>{ if(e.key==="Enter") handleAction("send-chat"); });
  }

  // post request form inputs
  ["prItem","prQty","prDetails"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", e=>{
      const key = id==="prItem"?"item":id==="prQty"?"qty":"details";
      state.postRequestForm = {...state.postRequestForm, [key]: e.target.value};
    });
  });

  const chatMsgs = document.getElementById("chatMessages");
  if(chatMsgs) chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function handleAction(act, val, el){
  switch(act){
    // ---- navigation ----
    case "nav": {
      const bigJumps = ["feed","browse","impact","profile","orgdash","events"];
      if(bigJumps.includes(val) && val!==state.screen){ withRouteTransition(()=>setState({screen:val})); }
      else setState({screen:val});
      break;
    }
    case "go-back": goBack(val); break;
    case "go-nameentry": setState({screen:"nameEntry", pendingMode:val}); break;
    case "submit-name": {
      const el2 = document.getElementById("nameEntryInput");
      const name = el2 ? el2.value.trim() : state.userName;
      if(!name){ showToast("Add a name to continue"); return; }
      if(val==="org"){ setState({userName:name, mode:"org", screen:"orgAbout"}); }
      else { setState({userName:name, mode:"donor", screen:"onboard", onboardStep:0}); }
      break;
    }
    case "go-donor": setState({screen:"nameEntry", pendingMode:"donor"}); break;
    case "go-orgonboard": setState({screen:"orgonboard", mode:"org"}); break;
    case "submit-org-about": {
      if(!state.orgEmail.trim() && !state.orgPhone.trim()){ showToast("Add an email or phone number so donors can reach you"); return; }
      setState({screen:"orgonboard"});
      break;
    }
    case "go-orgdash": setState({screen:"orgdash", mode:"org"}); break;
    case "switch-mode": {
      const newMode = state.mode==="org" ? "donor" : "org";
      setState({mode:newMode, screen:newMode==="org"?"orgdash":"feed"});
      break;
    }
    case "go-browse": setState({screen:"browse"}); break;
    case "go-events": setState({screen:"events"}); break;
    case "go-map": setState({screen:"mapView", mapOpenFor:null}); break;
    case "go-post-request": setState({screen:"postRequest", postRequestSuccess:false}); break;

    // ---- onboarding (chip toggle patches DOM only — no flicker) ----
    case "toggle-interest": {
      const list = state.interests.includes(val) ? state.interests.filter(i=>i!==val) : [...state.interests, val];
      state.interests = list;
      if(el) el.classList.toggle("selected");
      break; // intentionally no render() call — avoids full-page refresh per click
    }
    case "pick-give": setState({giveAs:val}); break;
    case "onboard-next": {
      if(state.onboardStep<2) setState({onboardStep:state.onboardStep+1});
      else { showToast("Your feed is ready"); setState({screen:"feed"}); }
      break;
    }
    case "skip-onboard": setState({screen:"feed"}); break;
    case "edit-onboarding": setState({screen:"onboard", onboardStep:0}); break;

    // ---- browse ----
    case "set-browse-filter": setState({browseFilter:val}); break;
    case "clear-browse-filters": setState({browseFilter:"All", browseSearch:""}); break;

    // ---- items / donation sheet ----
    case "open-item": {
      if(!val){ showToast("No open request for this org right now"); return; }
      const item = requests.find(r=>r.id==val);
      if(!item) return;
      setState({sheetOpen:true, sheetItem:item, qty:0, dropoff:null, donationStage:"form"});
      break;
    }
    case "close-sheet": setState({sheetOpen:false, sheetItem:null, donationStage:"form"}); break;
    case "open-pledge-list": setState({pledgeListOpen:true}); break;
    case "close-pledge-list": setState({pledgeListOpen:false}); break;
    case "qty-inc": setState({qty:state.qty+1}); break;
    case "qty-dec": setState({qty:Math.max(0,state.qty-1)}); break;
    case "pick-dropoff": setState({dropoff:val}); break;
    case "confirm-donation": {
      setState({donationStage:"loading"});
      setTimeout(()=>{
        state.sheetItem.have += state.qty;
        state.impact.items += state.qty;
        setState({donationStage:"success"});
        setTimeout(()=>{ setState({sheetOpen:false, sheetItem:null, donationStage:"form"}); showToast("You're in — we'll notify you the moment they confirm."); }, 1400);
      }, 700);
      break;
    }

    // ---- org profile / chat / map / share ----
    case "open-org-profile": setState({screen:"orgProfile", viewingOrg:val, orgProfileExpanded:false}); break;
    case "toggle-org-expand": setState({orgProfileExpanded:!state.orgProfileExpanded}); break;
    case "open-chat": goTo("chat", {extra:{chatOrg:val}}); break;
    case "send-chat": {
      const input = document.getElementById("chatInput");
      const text = (input?input.value:state.chatDraft||"").trim();
      if(!text) return;
      if(!chatThreads[state.chatOrg]) chatThreads[state.chatOrg]=[];
      chatThreads[state.chatOrg].push({from:"me", text});
      setState({chatDraft:""});
      setTimeout(()=>{ chatThreads[state.chatOrg].push({from:"them", text:"Got it — thank you! We'll follow up with drop-off details."}); render(); }, 900);
      break;
    }
    case "show-location": setState({screen:"mapView", mapOpenFor:val}); break;
    case "cta-event": {
      const evt = communityEvents.find(e=>e.id==val);
      goTo("helpFlow", {extra:{helpFlowOrg:evt.org, helpFlowStage:"form", helpFlowImage:null, helpFlowQty:1}});
      break;
    }

    // ---- event filters ----
    case "open-event-filters": setState({eventFilterSheetOpen:true}); break;
    case "toggle-cta-legend": setState({ctaLegendOpen:!state.ctaLegendOpen}); break;
    case "close-event-filters": setState({eventFilterSheetOpen:false}); break;
    case "set-event-type": setState({eventFilters:{...state.eventFilters, type:val}}); break;
    case "set-event-date": setState({eventFilters:{...state.eventFilters, date:val}}); break;
    case "toggle-urgent-filter": setState({eventFilters:{...state.eventFilters, urgentOnly:!state.eventFilters.urgentOnly}}); break;
    case "widen-events": setState({eventFilters:{...state.eventFilters, maxDistance:100}}); break;

    // ---- settings ----
    case "open-settings": setState({settingsOpen:true}); break;
    case "close-settings": {
      const el2 = document.getElementById("apiKeyInput");
      const key = el2 ? el2.value.trim() : state.apiKey;
      setState({settingsOpen:false, apiKey:key, aiStatus:key.length>10?"live":"mock"});
      break;
    }
    case "save-api-key": {
      const el3 = document.getElementById("apiKeyInput");
      const key = el3 ? el3.value.trim() : "";
      setState({apiKey:key, aiStatus:key.length>10?"live":"mock"});
      showToast(key.length>10 ? "Key saved — live Claude calls enabled" : "Key cleared — using mock responses");
      break;
    }
    case "retry-location": state.locStatus="idle"; requestRealLocation(); render(); break;

    // ---- scan ----
    case "open-scan": setState({screen:"scan", scanStage:"capture", scanImage:null, scanResult:null}); break;
    case "trigger-help-camera": document.getElementById("helpFlowFile").click(); break;
    case "help-qty-inc": setState({helpFlowQty:state.helpFlowQty+1}); break;
    case "help-qty-dec": setState({helpFlowQty:Math.max(1,state.helpFlowQty-1)}); break;
    case "submit-help-flow": {
      showToast(`Sent to ${state.helpFlowOrg} — thank you!`);
      setState({helpFlowStage:"success"});
      break;
    }
    case "trigger-camera": document.getElementById("cameraFile").click(); break;
    case "retake-scan": setState({scanStage:"capture", scanImage:null, scanResult:null}); break;
    case "scan-qty-inc": setState({scanResult:{...state.scanResult, qty:state.scanResult.qty+1}}); break;
    case "scan-qty-dec": setState({scanResult:{...state.scanResult, qty:Math.max(1,state.scanResult.qty-1)}}); break;
    case "confirm-scan": {
      const itemInput = document.getElementById("scanItemInput");
      const finalItem = itemInput ? itemInput.value : state.scanResult.item;
      const entry = {...state.scanResult, item:finalItem};
      setState({inventory:[...state.inventory, entry], screen:"impact", scanStage:"capture", scanImage:null, scanResult:null});
      showToast(`Added ${entry.qty} ${entry.unit} of ${entry.item} to your inventory`);
      break;
    }
    case "donate-inv": { const entry = state.inventory[parseInt(val)]; showToast(`Matching ${entry.item} to nearby requests...`); break; }

    // ---- trace ----
    case "open-trace": setState({traceOpen:true, traceVisible:0, traceConcise:true}); break;
    case "close-trace": setState({traceOpen:false, traceVisible:0}); break;
    case "toggle-trace-detail": setState({traceConcise:!state.traceConcise, traceVisible: state.traceConcise?0:traceLog.length}); break;

    // ---- org dashboard demo ----
    case "trigger-evening": setState({eveningStage:1}); break;
    case "confirm-business": setState({eveningStage:2}); break;
    case "accept-surplus": { setState({eveningStage:3}); state.impact.items+=18; showToast("Impact counter updated live"); break; }
    case "prepost": showToast("Request posted — nearby donors are being notified now"); break;

    // ---- post request (bug fix: real confirmation) ----
    case "set-pr-urgency": setState({postRequestForm:{...state.postRequestForm, urgency:val}}); break;
    case "submit-post-request": {
      const f = state.postRequestForm;
      if(!f.item.trim() || !f.qty.trim()){ showToast("Add an item and quantity to post"); return; }
      const cat = autoCategorize(f.item);
      const urgencyVal = f.urgency==="urgent" ? "urgent" : "ongoing";
      const orgName = state.userName || "Your organization";
      const loc = state.userLoc || HQ;
      orgQueue.unshift({id:Date.now(), item:f.item, need:parseInt(f.qty)||1, pledges:0, urgency:urgencyVal});
      requests.unshift({
        id: Date.now(), org: orgName, item: f.item.toLowerCase(), have: 0, need: parseInt(f.qty)||1,
        unit: "items", urgency: urgencyVal, category: cat, surplus:false, verified:true,
        details: f.details || "", pledgers: [],
        lat: loc.lat + (Math.random()-0.5)*0.02, lng: loc.lng + (Math.random()-0.5)*0.02,
      });
      setState({postRequestSuccess:true, postRequestForm:{item:"",qty:"",urgency:"urgent",details:""}});
      break;
    }

    // ---- I Can Help flow ----
    case "trigger-helpflow-camera": document.getElementById("helpFlowFile").click(); break;
    case "helpflow-qty-inc": setState({helpFlowQty: state.helpFlowQty+1}); break;
    case "helpflow-qty-dec": setState({helpFlowQty: Math.max(1, state.helpFlowQty-1)}); break;
    case "submit-help-flow": {
      const emailEl = document.getElementById("helpFlowEmail");
      const email = emailEl ? emailEl.value.trim() : state.helpFlowEmail;
      if(!email){ showToast("Add your email so the org can reach you"); return; }
      setState({helpFlowStage:"success", helpFlowEmail:email});
      state.impact.items += state.helpFlowQty;
      break;
    }

    // ---- finance ----
    case "open-finance": setState({financeSheetOpen:true, financeOrg: val||null}); break;
    case "close-finance": setState({financeSheetOpen:false}); break;
    case "fin-inc": setState({financeAmount:state.financeAmount+5}); break;
    case "fin-dec": setState({financeAmount:Math.max(5,state.financeAmount-5)}); break;
    case "confirm-finance": {
      showToast(`$${state.financeAmount} donated securely — thank you!`);
      setState({financeSheetOpen:false});
      break;
    }
  }
}

render();
</script>
