<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeedLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#77639F;
  --bg-deep:#5f4f83;
  --surface:#8977AC;
  --surface2:#9a8abb;
  --accent:#F0B34D;
  --accent-dim:#c99640;
  --cream:#FBF8F4;
  --muted:#DCD3EC;
  --muted-dim:#c3b6dc;
  --teal:#4E9E8F;
  --urgent:#E4573D;
  --scheduled:#F0B34D;
  --ongoing:#4CAF7D;
  --radius:14px;
  --radius-lg:18px;
  --shell-max:1180px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-deep);
  color:var(--cream);
  font-family:'League Spartan',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  letter-spacing:0;
}
h1,h2,h3{font-weight:800;margin:0;color:var(--cream);letter-spacing:0;}
p{margin:0;color:var(--muted);}
button{font-family:inherit;cursor:pointer;border:none;letter-spacing:0;}
a{color:inherit;}
svg{display:block;}

/* ---------- APP SHELL (mobile-first, desktop enhanced) ---------- */
#appShell{display:flex;min-height:100vh;max-width:var(--shell-max);margin:0 auto;background:var(--bg);}
#sidenav{
  display:none;flex-direction:column;width:220px;flex-shrink:0;
  background:var(--bg-deep);padding:24px 14px;gap:6px;position:sticky;top:0;height:100vh;
}
#app{flex:1;max-width:640px;margin:0 auto;position:relative;background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}

@media (min-width:900px){
  #sidenav.show{display:flex;}
  #app{max-width:640px;border-left:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06);}
  .screen{padding-left:36px;padding-right:36px;}
  .fab{right:calc(50% - 320px + 20px) !important;left:auto !important;transform:none !important;}
  .fab:active{transform:scale(0.92) !important;}
}

.sidenav-logo{display:flex;align-items:center;gap:8px;padding:6px 10px 22px 10px;}
.sidenav-logo img{width:34px;height:34px;object-fit:contain;}
.sidenav-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  color:var(--muted);font-weight:600;font-size:14px;background:none;text-align:left;width:100%;
}
.sidenav-item svg{width:20px;height:20px;flex-shrink:0;}
.sidenav-item.active{background:var(--surface);color:var(--accent);}
.sidenav-item:hover{color:var(--cream);}

.btn-primary{
  background:var(--accent);color:#3a2018;font-weight:700;padding:15px 20px;border-radius:var(--radius);
  font-size:16px;width:100%;transition:transform .15s ease-out, box-shadow .15s ease-out;
  box-shadow:0 4px 14px rgba(240,179,77,0.25);display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary:active{transform:scale(0.97);}
.btn-primary:disabled{opacity:0.45;}
.btn-outline{
  background:transparent;border:2px solid var(--accent);color:var(--accent);font-weight:700;
  padding:13px 20px;border-radius:var(--radius);font-size:16px;width:100%;transition:transform .15s ease-out, background .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-outline:active{transform:scale(0.97);}
.btn-ghost{background:transparent;color:var(--muted);font-weight:600;padding:8px;font-size:14px;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{color:var(--cream);}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{color:var(--cream);}

.screen{padding:22px 20px 100px 20px;animation:fadeSlideIn .25s ease-out;flex:1;display:flex;flex-direction:column;}
.screen.zoom-in{animation:zoomIn .3s cubic-bezier(.2,.8,.2,1);}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes zoomIn{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}

.card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;}

/* top bar shared across screens */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand img{height:28px;object-fit:contain;}

/* ---------- LOADING TRANSITION OVERLAY ---------- */
.route-loading{
  position:fixed;inset:0;background:var(--bg-deep);z-index:200;display:flex;align-items:center;justify-content:center;
  animation:routeFade .28s ease-out;
}
@keyframes routeFade{from{opacity:0;}to{opacity:1;}}
.route-loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,179,77,0.25);border-top-color:var(--accent);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Splash ---------- */
.splash{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.splash img{width:150px;object-fit:contain;animation:logoPop .6s cubic-bezier(.2,.9,.3,1.2);}
@keyframes logoPop{from{opacity:0;transform:scale(0.7);}to{opacity:1;transform:scale(1);}}

/* progress dots */
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--surface2);transition:background .3s, width .3s;}
.dot.active{background:var(--accent);width:22px;border-radius:5px;}

/* chips */
.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
.chip{padding:10px 16px;border-radius:20px;background:var(--surface);color:var(--cream);border:2px solid transparent;font-weight:600;font-size:14px;transition:transform .15s ease-out, background .2s;}
.chip.selected{background:var(--accent);color:#3a2018;transform:scale(1.05);}

/* bottom nav (mobile) */
.bottomnav{position:sticky;bottom:0;left:0;right:0;background:var(--bg-deep);display:flex;justify-content:space-around;padding:9px 0 12px 0;border-top:1px solid rgba(255,255,255,0.08);}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;background:none;padding:4px 10px;position:relative;}
.navitem svg{width:21px;height:21px;}
.navitem.active{color:var(--accent);}
.navitem.active::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:16px;height:3px;background:var(--accent);border-radius:2px;}
@media (min-width:900px){.bottomnav{display:none;}}

/* request/event card */
.req-card{min-width:220px;background:var(--surface);border-radius:var(--radius-lg);padding:14px;flex-shrink:0;transition:transform .15s ease-out;border:1px solid transparent;}
.req-card:active{transform:scale(0.97);}
.req-card.surplus{border-color:var(--teal);}
.scroll-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.scroll-row::-webkit-scrollbar{display:none;}
.grid-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.org-name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:var(--cream);}
.check{color:var(--accent);width:13px;height:13px;flex-shrink:0;}
.progress-bar{height:8px;background:rgba(255,255,255,0.12);border-radius:6px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease-out;}
.progress-fill.teal{background:var(--teal);}

/* urgency tags: red/orange/green */
.utag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:8px;margin-bottom:6px;letter-spacing:0.3px;text-transform:uppercase;}
.utag.urgent{background:rgba(228,87,61,0.18);color:var(--urgent);border:1px solid rgba(228,87,61,0.5);}
.utag.scheduled{background:rgba(240,179,77,0.16);color:var(--scheduled);border:1px solid rgba(240,179,77,0.5);}
.utag.ongoing{background:rgba(76,175,125,0.16);color:var(--ongoing);border:1px solid rgba(76,175,125,0.5);}
.utag.surplus{background:rgba(78,158,143,0.16);color:var(--teal);border:1px solid rgba(78,158,143,0.5);}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin:24px 0 10px 0;display:flex;justify-content:space-between;align-items:center;}
.see-all{color:var(--accent);font-size:12px;font-weight:700;}

/* sheet */
.sheet-backdrop{position:fixed;inset:0;background:rgba(30,20,45,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:150;animation:fadeIn .2s ease-out;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 30px 20px;animation:slideUp .28s ease-out;max-height:88vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px;margin:20px 0;}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#3a2018;font-size:22px;font-weight:800;}
.stepper .val{font-size:32px;font-weight:800;min-width:50px;text-align:center;}
.taptarget{flex:1;background:var(--bg-deep);border:2px solid var(--surface2);border-radius:var(--radius);padding:16px;text-align:center;font-weight:700;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:8px;}
.taptarget svg{width:22px;height:22px;}
.taptarget.selected{border-color:var(--accent);background:rgba(240,179,77,0.12);color:var(--accent);}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg-deep);color:var(--cream);padding:12px 18px;border-radius:12px;font-size:13px;max-width:400px;text-align:center;z-index:220;animation:toastIn .3s ease-out;box-shadow:0 4px 20px rgba(0,0,0,0.3);display:flex;align-items:center;gap:8px;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.skel{background:linear-gradient(90deg, var(--surface) 25%, var(--surface2) 37%, var(--surface) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:var(--radius);}
@keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

.org-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.badge-count{background:var(--accent);color:#3a2018;font-weight:800;font-size:12px;border-radius:10px;padding:2px 9px;}

.forecast-card{border:1.5px solid var(--accent);border-radius:var(--radius-lg);padding:16px;margin-bottom:20px;animation:pulseBorder 3s infinite;background:var(--surface);}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 0 rgba(240,179,77,0.0);}50%{box-shadow:0 0 0 5px rgba(240,179,77,0.1);}}

.trace-panel{background:#241730;border-radius:var(--radius-lg);padding:18px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.7;color:#e7dcff;min-height:100px;}
.trace-line{opacity:0;animation:traceIn .35s ease-out forwards;margin-bottom:8px;}
@keyframes traceIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.trace-line .agent{color:var(--accent);font-weight:600;}
.trace-summary{background:rgba(240,179,77,0.1);border:1px solid rgba(240,179,77,0.3);border-radius:12px;padding:14px;font-family:'League Spartan',sans-serif;font-size:14px;color:var(--cream);margin-bottom:16px;line-height:1.5;}

.counter{font-size:40px;font-weight:800;color:var(--accent);}
.give-card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-bottom:10px;border:2px solid transparent;transition:all .15s;display:flex;gap:14px;align-items:flex-start;}
.give-card.selected{border-color:var(--accent);}
.give-card svg{width:26px;height:26px;color:var(--accent);flex-shrink:0;margin-top:2px;}

.impact-stat{text-align:center;}
.impact-stat .num{font-size:34px;font-weight:800;color:var(--accent);}
.impact-stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;}

.timeline-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
.status-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.status-dot.confirmed{background:var(--accent);}
.status-dot.pending{background:transparent;border:2px solid var(--muted);}

.reliability{font-size:11px;color:var(--teal);font-weight:600;margin-top:4px;}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 20px;}

.map-preview{height:120px;border-radius:var(--radius);background:radial-gradient(circle, rgba(240,179,77,0.25) 0%, var(--surface) 70%);display:flex;align-items:center;justify-content:center;margin-top:14px;animation:mapIn .5s ease-out;position:relative;overflow:hidden;}
@keyframes mapIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.radius-circle{width:70px;height:70px;border:2px solid var(--accent);border-radius:50%;animation:radiusPulse 2s infinite;}
@keyframes radiusPulse{0%{transform:scale(0.8);opacity:0.6;}50%{transform:scale(1.15);opacity:1;}100%{transform:scale(0.8);opacity:0.6;}}

input[type=text],textarea,select{width:100%;padding:14px;border-radius:var(--radius);border:2px solid var(--surface2);background:var(--surface);color:var(--cream);font-family:inherit;font-size:15px;}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:80px;}
label.field-label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;margin-top:16px;}

.top-toggle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.mode-switch{font-size:11px;color:var(--muted);background:var(--surface);padding:6px 12px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:6px;}

.evening-banner{background:linear-gradient(135deg, #2f6f64, var(--teal));border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;color:#0c211d;animation:fadeSlideIn .4s ease-out;}
.evening-banner b{display:block;font-size:15px;margin-bottom:2px;}

.split-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:8px;gap:2px;}
.split-seg{background:var(--teal);opacity:0.9;}

.inv-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}

/* ---------- Community Alerts & Events ---------- */
.live-flash{position:relative;overflow:hidden;}
.live-flash::before{
  content:'';position:absolute;inset:0;border-radius:inherit;border:2px solid var(--urgent);
  animation:flashBorder 1.1s ease-in-out infinite;pointer-events:none;
}
@keyframes flashBorder{0%,100%{opacity:0.35;}50%{opacity:1;}}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:var(--urgent);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:8px;letter-spacing:0.4px;text-transform:uppercase;position:absolute;top:14px;right:14px;}
.live-badge .liveDot{width:6px;height:6px;border-radius:50%;background:#fff;animation:livedot 1s infinite;}
@keyframes livedot{0%,100%{opacity:1;}50%{opacity:0.25;}}

.events-banner-wrap{margin-bottom:6px;}
.events-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none;}
.events-scroll::-webkit-scrollbar{display:none;}
.event-banner{scroll-snap-align:start;min-width:88%;background:linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);border-radius:var(--radius-lg);padding:18px;position:relative;overflow:hidden;border:1px solid rgba(240,179,77,0.15);}
.event-banner .evt-org{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.4px;text-transform:uppercase;display:flex;align-items:center;gap:5px;}
.event-banner h3{font-size:17px;margin-top:6px;line-height:1.2;}
.event-banner .evt-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted);}
.event-banner .evt-meta span{display:flex;align-items:center;gap:4px;}
.event-banner p.evt-desc{font-size:12px;color:var(--cream);opacity:0.9;margin-top:8px;line-height:1.4;}
.event-banner .evt-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.event-banner .evt-actions button{padding:11px 12px;border-radius:10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.cta-help{background:var(--accent);color:#3a2018;}
.cta-donate{background:var(--teal);color:#0c211d;}
.cta-volunteer{background:#7C8FE0;color:#1a1f3d;}
.cta-learn{background:transparent;border:1.5px solid var(--muted-dim);color:var(--cream);}
.evt-loc-btn{background:transparent;border:1.5px solid var(--surface2);color:var(--cream);width:42px;flex:none !important;padding:0 !important;display:flex;align-items:center;justify-content:center;}
.dist-pill{font-size:10px;color:var(--teal);font-weight:700;}
.cta-legend{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.cta-legend .row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.cta-legend .sw{width:14px;height:14px;border-radius:5px;flex-shrink:0;}

.filter-pill-row{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px 0;scrollbar-width:none;}
.filter-pill-row::-webkit-scrollbar{display:none;}
.filter-pill{flex-shrink:0;padding:9px 14px;border-radius:20px;background:var(--surface);border:1.5px solid transparent;font-size:12.5px;font-weight:600;color:var(--cream);}
.filter-pill.active{border-color:var(--accent);color:var(--accent);}

.event-row{display:flex;gap:12px;background:var(--surface);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;position:relative;}
.event-row .evt-body{flex:1;}
.event-row h4{font-size:14px;}
.event-row p{font-size:11px;margin-top:3px;}

.gear-btn{background:var(--surface);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.gear-btn svg{width:18px;height:18px;}
.key-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:6px 10px;border-radius:20px;margin-top:10px;}
.status-pill.live{background:rgba(78,158,143,0.18);color:var(--teal);}
.status-pill.mock{background:rgba(220,211,236,0.14);color:var(--muted);}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:livedot 1.4s infinite;}

.ai-thinking{font-weight:700;font-size:13px;background:linear-gradient(90deg, var(--muted) 20%, var(--accent) 50%, var(--muted) 80%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmerText 1.6s linear infinite;}
@keyframes shimmerText{0%{background-position:200% center;}100%{background-position:-200% center;}}

.match-reveal{animation:matchIn .5s cubic-bezier(.2,.9,.3,1.3);border:1.5px solid var(--accent);}
@keyframes matchIn{0%{opacity:0;transform:scale(0.85) translateY(14px);}60%{opacity:1;transform:scale(1.03) translateY(-2px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.match-score-ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--surface2) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:ringIn .8s ease-out;}
@keyframes ringIn{from{filter:brightness(2) blur(2px);}to{filter:brightness(1) blur(0);}}
.match-score-ring .inner{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--accent);}

.scan-frame{width:100%;aspect-ratio:4/3;border-radius:var(--radius-lg);background:var(--surface);border:2px dashed var(--surface2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;overflow:hidden;position:relative;}
.scan-frame img{width:100%;height:100%;object-fit:cover;}
.scan-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:scanSweep 1.4s ease-in-out infinite;}
@keyframes scanSweep{0%{top:6%;}50%{top:94%;}100%{top:6%;}}
.item-input{background:var(--bg-deep);border:2px solid var(--surface2);border-radius:10px;color:var(--cream);font-weight:700;font-size:16px;text-align:left;padding:10px 12px;font-family:inherit;width:100%;}

.fab{position:fixed;left:50%;transform:translateX(calc(-50% + 200px));bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#3a2018;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(240,179,77,0.4);z-index:40;transition:transform .15s ease-out;}
.fab:active{transform:translateX(calc(-50% + 200px)) scale(0.92);}
.fab svg{width:24px;height:24px;}

/* org profile page */
.org-hero{background:linear-gradient(135deg, var(--surface2), var(--surface));border-radius:var(--radius-lg);padding:20px;}
.org-hero .avatar{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#3a2018;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;}
.social-row{display:flex;gap:10px;margin-top:14px;}
.social-btn{width:38px;height:38px;border-radius:50%;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;color:var(--cream);}
.social-btn svg{width:16px;height:16px;}
.expand-toggle{font-size:12px;color:var(--accent);font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px;}

/* chat */
.chat-window{display:flex;flex-direction:column;height:60vh;background:var(--bg-deep);border-radius:var(--radius-lg);overflow:hidden;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.4;}
.msg.them{background:var(--surface);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.me{background:var(--accent);color:#3a2018;align-self:flex-end;border-bottom-right-radius:4px;font-weight:600;}
.chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,0.08);}
.chat-input-row input{flex:1;}
.chat-send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#3a2018;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send svg{width:18px;height:18px;}

/* map */
.map-frame{width:100%;height:340px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid rgba(255,255,255,0.1);}
.map-frame iframe{width:100%;height:100%;border:0;filter:saturate(0.85);}
.map-legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}
.map-legend .row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.map-legend .dot{width:10px;height:10px;border-radius:50%;}

/* finance */
.finance-icon-btn{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#3a2018;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.finance-icon-btn svg{width:24px;height:24px;}

/* partner strip */
.partner-strip{display:flex;gap:16px;overflow-x:auto;padding:14px 0;scrollbar-width:none;}
.partner-strip::-webkit-scrollbar{display:none;}
.partner-chip{flex-shrink:0;background:var(--surface);border-radius:14px;padding:14px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px;}
.partner-chip .pinit{width:38px;height:38px;border-radius:10px;background:var(--bg-deep);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);}
.partner-chip span{font-size:11px;color:var(--muted);text-align:center;font-weight:600;}

/* search bar */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);padding:12px 14px;border:2px solid transparent;}
.search-bar:focus-within{border-color:var(--accent);}
.search-bar svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
.search-bar input{background:none;border:none;padding:0;color:var(--cream);font-size:14px;width:100%;}
.search-bar input:focus{outline:none;}

/* toggle switch (urgent/not urgent) */
.toggle-row{display:flex;gap:10px;margin-top:8px;}
.toggle-opt{flex:1;padding:12px;border-radius:var(--radius);text-align:center;font-weight:700;font-size:13px;border:2px solid var(--surface2);background:var(--bg-deep);}
.toggle-opt.on-urgent{border-color:var(--urgent);color:var(--urgent);background:rgba(228,87,61,0.1);}
.toggle-opt.on-ok{border-color:var(--ongoing);color:var(--ongoing);background:rgba(76,175,125,0.1);}
</style>
</head>

function haversineMiles(lat1,lng1,lat2,lng2){
  const R = 3958.8;
  const dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function liveDistance(item){
  if(state.userLoc && item.lat){
    const mi = haversineMiles(state.userLoc.lat, state.userLoc.lng, item.lat, item.lng);
    return mi<0.1 ? "< 0.1 mi" : mi.toFixed(1)+" mi";
  }
  return "— mi";
}
function requestRealLocation(){
  if(state.locStatus!=="idle" || !("geolocation" in navigator)) return;
  state.locStatus="requesting";
  navigator.geolocation.getCurrentPosition(
    (pos)=>{ setState({userLoc:{lat:pos.coords.latitude,lng:pos.coords.longitude}, locStatus:"granted"}); },
    ()=>{ setState({locStatus:"denied"}); },
    {timeout:6000}
  );
}

function setState(patch){ state = {...state, ...patch}; render(); }

function goTo(screen, opts={}){
  const push = opts.push !== false;
  if(push && state.screen!==screen) state.navHistory.push(state.screen);
  setState({screen, ...opts.extra});
}
function goBack(fallback="feed"){
  const prev = state.navHistory.pop();
  setState({screen: prev || fallback});
}

function showToast(msg, ms=3200){
  setState({toast:{msg}});
  setTimeout(()=>{ if(state.toast && state.toast.msg===msg) setState({toast:null}); }, ms);
}

function withRouteTransition(fn){
  state.routeLoading = true;
  render();
  setTimeout(()=>{ state.routeLoading=false; fn(); }, 260);
}

// ---------- RENDER CORE ----------
function render(){
  const shell = document.getElementById('appShell');
  const app = document.getElementById('app');
  const sidenav = document.getElementById('sidenav');

  const showSideAndBottomNav = ["feed","browse","impact","profile","events","orgdash"].includes(state.screen);
  sidenav.className = showSideAndBottomNav && state.mode==="donor" ? "show" : "";
  sidenav.innerHTML = showSideAndBottomNav && state.mode==="donor" ? sidenavHtml(state.screen) : "";

  let html = "";
  if(state.screen==="splash") html = renderSplash();
  else if(state.screen==="landing") html = renderLanding();
  else if(state.screen==="nameEntry") html = renderNameEntry();
  else if(state.screen==="onboard") html = renderOnboard();
  else if(state.screen==="feed") html = renderFeed();
  else if(state.screen==="browse") html = renderBrowse();
  else if(state.screen==="impact") html = renderImpact();
  else if(state.screen==="profile") html = renderProfile();
  else if(state.screen==="orgdash") html = renderOrgDash();
  else if(state.screen==="orgonboard") html = renderOrgOnboard();
  else if(state.screen==="scan") html = renderScan();
  else if(state.screen==="events") html = renderEvents();
  else if(state.screen==="orgProfile") html = renderOrgProfile();
  else if(state.screen==="chat") html = renderChat();
  else if(state.screen==="mapView") html = renderMapView();
  else if(state.screen==="postRequest") html = renderPostRequest();

  let overlay = "";
  if(state.sheetOpen) overlay += renderDonationSheet();
  if(state.traceOpen) overlay += renderTracePanel();
  if(state.eventFilterSheetOpen) overlay += renderEventFilterSheet();
  if(state.settingsOpen) overlay += renderSettingsSheet();
  if(state.financeSheetOpen) overlay += renderFinanceSheet();
  if(state.toast) overlay += `<div class="toast">${iconWrap('check',15,'var(--accent)')} ${state.toast.msg}</div>`;
  if(state.routeLoading) overlay += `<div class="route-loading"><div class="spin"></div></div>`;

  app.innerHTML = html + overlay;
  attachHandlers();

  if(state.traceOpen && !state.traceConcise && state.traceVisible < traceLog.length){
    setTimeout(()=>{ setState({traceVisible: state.traceVisible+1}); }, 650);
  }
}

function filteredEvents(){

// ---------- DONATION SHEET (surplus match now driven by donor's entered qty) ----------
function renderDonationSheet(){
  const r = state.sheetItem;
  if(!r) return "";
  const pct = Math.min(100, Math.round((r.have/r.need)*100));
  let inner = "";
  if(state.donationStage==="form"){
    inner = `
    <div class="org-name">${r.org} ${iconWrap('check',13,'var(--accent)')}</div>
    <p style="font-size:12px;margin-top:4px;">${r.have} of ${r.need} ${r.unit} · ${liveDistance(r)}</p>
    <div class="progress-bar"><div class="progress-fill ${r.surplus?'teal':''}" style="width:${pct}%"></div></div>

    <label class="field-label">How many ${r.unit} are you giving?</label>
    <div class="stepper">
      <button data-act="qty-dec">–</button>
      <div class="val">${state.qty}</div>
      <button data-act="qty-inc">+</button>
    </div>

    ${state.qty>0 ? matchCheckHtml(r, state.qty) : ""}

    <label class="field-label">Drop-off or pickup?</label>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="taptarget ${state.dropoff==='dropoff'?'selected':''}" data-act="pick-dropoff" data-val="dropoff">${icon('truck',20)}I'll drop it off</button>
      <button class="taptarget ${state.dropoff==='pickup'?'selected':''}" data-act="pick-dropoff" data-val="pickup">${icon('box',20)}Request pickup</button>
    </div>

    <button class="btn-primary" style="margin-top:24px;" data-act="confirm-donation" ${(state.qty<1||!state.dropoff)?'disabled':''}>Confirm pledge</button>
    `;
  } else if(state.donationStage==="loading"){
    inner = `<div style="display:flex;flex-direction:column;align-items:center;padding:30px 0;">
      <img src="${LOGO_SRC}" style="width:44px;">
      <p style="margin-top:14px;">Sending your pledge...</p>
    </div>`;
  } else if(state.donationStage==="success"){
    inner = `<div style="display:flex;flex-direction:column;align-items:center;padding:20px 0;">
      ${iconWrap('check',50,'var(--accent)')}
      <h3 style="margin-top:14px;font-size:18px;">You're in!</h3>
      <div class="progress-bar" style="width:100%;margin-top:16px;"><div class="progress-fill ${r.surplus?'teal':''}" style="width:${Math.min(100,Math.round(((r.have+state.qty)/r.need)*100))}%"></div></div>
      <p style="font-size:12px;margin-top:8px;">${r.have+state.qty} of ${r.need} ${r.unit}</p>
    </div>`;
  }
  return `<div class="sheet-backdrop" data-act="${state.donationStage==='form'?'close-sheet':''}">
    <div class="sheet" onclick="event.stopPropagation()">${inner}</div>
  </div>`;
}

function matchCheckHtml(r, qty){
  const remaining = r.need - r.have;
  const overBy = qty - remaining;
  if(overBy > 0){
    return `<div class="card" style="margin-top:14px;border:1px solid var(--teal);">
      <p style="font-size:12px;color:var(--teal);font-weight:700;">${iconWrap('box',13,'var(--teal)')} Surplus detected</p>
      <p style="font-size:12.5px;margin-top:6px;">${r.org} only needs ${remaining} more ${r.unit} — the extra ${overBy} will be offered to the next-closest org that needs ${r.item}.</p>
    </div>`;
  } else if(overBy===0){
    return `<div class="card" style="margin-top:14px;border:1px solid var(--accent);">
      <p style="font-size:12.5px;color:var(--accent);font-weight:700;">${iconWrap('check',13,'var(--accent)')} That's exactly what's still needed — full match.</p>
    </div>`;
  } else {
    return `<div class="card" style="margin-top:14px;">
      <p style="font-size:12.5px;">This covers ${qty} of the remaining ${remaining} ${r.unit} needed.</p>
    </div>`;
  }
}

// ---------- REAL AI VISION SCAN + BEST-MATCH SCORING ----------
async function runScanAnalysis(dataUrl, mimeType){
  if(state.apiKey && state.apiKey.trim().length > 10){
    try{
      const base64 = dataUrl.split(",")[1];
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":state.apiKey.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6", max_tokens:300,
          messages:[{role:"user", content:[
            {type:"image", source:{type:"base64", media_type:mimeType, data:base64}},
            {type:"text", text:"Identify the donation item in this photo and, if a quantity is printed on the box/label, extract it. Respond with ONLY raw JSON: {\"item\":\"short item name\",\"qty\":number,\"unit\":\"unit word\",\"category\":\"Food|Shelter|Education|Health\"}. If quantity isn't visible, estimate 1."}
          ]}]
        })
      });
      const data = await resp.json();
      const textBlock = (data.content||[]).find(b=>b.type==="text");
      if(!textBlock) throw new Error("No text in response");
      const parsed = JSON.parse(textBlock.text.replace(/```json|```/g,"").trim());
      setState({scanStage:"result", scanResult:parsed, aiStatus:"live"});
      computeBestMatch(parsed);
      return;
    }catch(err){
      console.error("Live vision call failed, falling back to mock:", err);
      setState({scanError:"Live scan failed — showing a best-effort guess instead."});
    }
  }
  setTimeout(()=>{
    const guesses = [
      {item:"Canned soup", qty:12, unit:"cans", category:"Food"},
      {item:"Bottled water", qty:24, unit:"bottles", category:"Food"},
      {item:"Winter coats", qty:3, unit:"coats", category:"Shelter"},
      {item:"Cereal boxes", qty:8, unit:"boxes", category:"Food"},
    ];
    const guess = guesses[Math.floor(Math.random()*guesses.length)];
    setState({scanStage:"result", scanResult:{...guess}});
    computeBestMatch(guess);
  }, 1200);
}

function computeBestMatch(result){
  const category = (result.category||"").toLowerCase();
  let best=null, bestScore=-1;
  requests.forEach(r=>{
    const remaining = r.need - r.have;
    if(remaining<=0) return;
    const distMi = state.userLoc && r.lat ? haversineMiles(state.userLoc.lat,state.userLoc.lng,r.lat,r.lng) : 5;
    const catMatch = category && r.category.toLowerCase()===category ? 1 : 0.3;
    const urgencyBoost = r.urgency==="urgent" ? 0.25 : 0;
    const distScore = Math.max(0, 1-(distMi/15));
    const score = catMatch*0.45 + distScore*0.3 + urgencyBoost;
    if(score>bestScore){ bestScore=score; best={...r, distMi, score}; }
  });
  if(best) state.bestMatch = {...best, pct: Math.round(Math.min(99, bestScore*100))};
}

// ---------- HANDLERS ----------
function attachHandlers(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      handleAction(el.getAttribute("data-act"), el.getAttribute("data-val"), el);
    });
  });

  const counterNum = document.getElementById("counterNum");
  if(counterNum){
    let target=12480, cur=0;
    const step=()=>{ cur+=Math.ceil(target/40); if(cur>=target)cur=target; counterNum.textContent=cur.toLocaleString(); if(cur<target) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  const cameraFile = document.getElementById("cameraFile");
  if(cameraFile){
    cameraFile.addEventListener("change", (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{ setState({scanStage:"analyzing", scanImage:ev.target.result, scanError:null}); runScanAnalysis(ev.target.result, file.type||"image/jpeg"); };
      reader.readAsDataURL(file);
    });
  }

  const distSlider = document.getElementById("distSlider");
  if(distSlider){
    distSlider.addEventListener("input", e=>{ state.eventFilters={...state.eventFilters, maxDistance:parseInt(e.target.value)}; });
    distSlider.addEventListener("change", e=>{ setState({eventFilters:{...state.eventFilters, maxDistance:parseInt(e.target.value)}}); });
  }

  const apiKeyInput = document.getElementById("apiKeyInput");
  if(apiKeyInput) apiKeyInput.addEventListener("input", e=>{ state.apiKey = e.target.value; });

  const locInput = document.getElementById("locInput");
  if(locInput){
    locInput.addEventListener("blur", e=>setState({location:e.target.value}));
    locInput.addEventListener("keyup", e=>{ if(e.key==="Enter") setState({location:e.target.value}); });
  }

  const nameInput = document.getElementById("nameEntryInput");
  if(nameInput) nameInput.addEventListener("input", e=>{ state.userName = e.target.value; });

  // search bar: targeted update, no focus loss
  const searchInput = document.getElementById("browseSearchInput");
  if(searchInput){
    searchInput.addEventListener("input", e=>{ state.browseSearch = e.target.value; updateBrowseResults(); });
  }

  // chat input + enter-to-send
  const chatInput = document.getElementById("chatInput");
  if(chatInput){
    chatInput.addEventListener("input", e=>{ state.chatDraft = e.target.value; });
    chatInput.addEventListener("keyup", e=>{ if(e.key==="Enter") handleAction("send-chat"); });
  }

  // post request form inputs
  ["prItem","prQty","prDetails"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("input", e=>{
      const key = id==="prItem"?"item":id==="prQty"?"qty":"details";
      state.postRequestForm = {...state.postRequestForm, [key]: e.target.value};
    });
  });

  const chatMsgs = document.getElementById("chatMessages");
  if(chatMsgs) chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function handleAction(act, val, el){
  switch(act){
    // ---- navigation ----
    case "nav": {
      const bigJumps = ["feed","browse","impact","profile","orgdash","events"];
      if(bigJumps.includes(val) && val!==state.screen){ withRouteTransition(()=>setState({screen:val})); }
      else setState({screen:val});
      break;
    }
    case "go-back": goBack(val); break;
    case "go-nameentry": setState({screen:"nameEntry", pendingMode:val}); break;
    case "submit-name": {
      const el2 = document.getElementById("nameEntryInput");
      const name = el2 ? el2.value.trim() : state.userName;
      if(!name){ showToast("Add a name to continue"); return; }
      if(val==="org"){ setState({userName:name, mode:"org", screen:"orgonboard"}); }
      else { setState({userName:name, mode:"donor", screen:"onboard", onboardStep:0}); }
      break;
    }
    case "go-donor": setState({screen:"nameEntry", pendingMode:"donor"}); break;
    case "go-orgonboard": setState({screen:"orgonboard", mode:"org"}); break;
    case "go-orgdash": setState({screen:"orgdash", mode:"org"}); break;
    case "go-browse": setState({screen:"browse"}); break;
    case "go-events": setState({screen:"events"}); break;
    case "go-map": setState({screen:"mapView", mapOpenFor:null}); break;
    case "go-post-request": setState({screen:"postRequest", postRequestSuccess:false}); break;

    // ---- onboarding (chip toggle patches DOM only — no flicker) ----
    case "toggle-interest": {
      const list = state.interests.includes(val) ? state.interests.filter(i=>i!==val) : [...state.interests, val];
      state.interests = list;
      if(el) el.classList.toggle("selected");
      break; // intentionally no render() call — avoids full-page refresh per click
    }
    case "pick-give": setState({giveAs:val}); break;
    case "onboard-next": {
      if(state.onboardStep<2) setState({onboardStep:state.onboardStep+1});
      else { showToast("Your feed is ready"); setState({screen:"feed"}); }
      break;
    }
    case "skip-onboard": setState({screen:"feed"}); break;
    case "edit-onboarding": setState({screen:"onboard", onboardStep:0}); break;

    // ---- browse ----
    case "set-browse-filter": setState({browseFilter:val}); break;
    case "clear-browse-filters": setState({browseFilter:"All", browseSearch:""}); break;

    // ---- items / donation sheet ----
    case "open-item": {
      if(!val){ showToast("No open request for this org right now"); return; }
      const item = requests.find(r=>r.id==val);
      if(!item) return;
      setState({sheetOpen:true, sheetItem:item, qty:0, dropoff:null, donationStage:"form"});
      break;
    }
    case "close-sheet": setState({sheetOpen:false, sheetItem:null, donationStage:"form"}); break;
    case "qty-inc": setState({qty:state.qty+1}); break;
    case "qty-dec": setState({qty:Math.max(0,state.qty-1)}); break;
    case "pick-dropoff": setState({dropoff:val}); break;
    case "confirm-donation": {
      setState({donationStage:"loading"});
      setTimeout(()=>{
        state.sheetItem.have += state.qty;
        state.impact.items += state.qty;
        setState({donationStage:"success"});
        setTimeout(()=>{ setState({sheetOpen:false, sheetItem:null, donationStage:"form"}); showToast("You're in — we'll notify you the moment they confirm."); }, 1400);
      }, 700);
      break;
    }

    // ---- org profile / chat / map / share ----
    case "open-org-profile": setState({screen:"orgProfile", viewingOrg:val, orgProfileExpanded:false}); break;
    case "toggle-org-expand": setState({orgProfileExpanded:!state.orgProfileExpanded}); break;
    case "open-chat": goTo("chat", {extra:{chatOrg:val}}); break;
    case "send-chat": {
      const input = document.getElementById("chatInput");
      const text = (input?input.value:state.chatDraft||"").trim();
      if(!text) return;
      if(!chatThreads[state.chatOrg]) chatThreads[state.chatOrg]=[];
      chatThreads[state.chatOrg].push({from:"me", text});
      setState({chatDraft:""});
      setTimeout(()=>{ chatThreads[state.chatOrg].push({from:"them", text:"Got it — thank you! We'll follow up with drop-off details."}); render(); }, 900);
      break;
    }
    case "show-location": setState({screen:"mapView", mapOpenFor:val}); break;
    case "share-event": {
      const evt = communityEvents.find(e=>e.id==val);
      const shareText = `${evt.title} — ${evt.org}, ${evt.date}. ${evt.desc}`;
      if(navigator.share) navigator.share({title:evt.title, text:shareText}).catch(()=>{});
      else if(navigator.clipboard){ navigator.clipboard.writeText(shareText); showToast("Copied event details to clipboard"); }
      break;
    }
    case "cta-event": {
      const evt = communityEvents.find(e=>e.id==val);
      if(evt.cta === "Learn More"){ setState({screen:"orgProfile", viewingOrg:evt.org, orgProfileExpanded:false}); return; }
      showToast(`${evt.cta} sent to ${evt.org} — they'll follow up with next steps.`);
      break;
    }

    // ---- event filters ----
    case "open-event-filters": setState({eventFilterSheetOpen:true}); break;
    case "close-event-filters": setState({eventFilterSheetOpen:false}); break;
    case "set-event-type": setState({eventFilters:{...state.eventFilters, type:val}}); break;
    case "set-event-date": setState({eventFilters:{...state.eventFilters, date:val}}); break;
    case "toggle-urgent-filter": setState({eventFilters:{...state.eventFilters, urgentOnly:!state.eventFilters.urgentOnly}}); break;
    case "widen-events": setState({eventFilters:{...state.eventFilters, maxDistance:100}}); break;

    // ---- settings ----
    case "open-settings": setState({settingsOpen:true}); break;
    case "close-settings": {
      const el2 = document.getElementById("apiKeyInput");
      const key = el2 ? el2.value.trim() : state.apiKey;
      setState({settingsOpen:false, apiKey:key, aiStatus:key.length>10?"live":"mock"});
      break;
    }
    case "save-api-key": {
      const el3 = document.getElementById("apiKeyInput");
      const key = el3 ? el3.value.trim() : "";
      setState({apiKey:key, aiStatus:key.length>10?"live":"mock"});
      showToast(key.length>10 ? "Key saved — live Claude calls enabled" : "Key cleared — using mock responses");
      break;
    }
    case "retry-location": state.locStatus="idle"; requestRealLocation(); render(); break;

    // ---- scan ----
    case "open-scan": setState({screen:"scan", scanStage:"capture", scanImage:null, scanResult:null}); break;
    case "trigger-camera": document.getElementById("cameraFile").click(); break;
    case "retake-scan": setState({scanStage:"capture", scanImage:null, scanResult:null}); break;
    case "scan-qty-inc": setState({scanResult:{...state.scanResult, qty:state.scanResult.qty+1}}); break;
    case "scan-qty-dec": setState({scanResult:{...state.scanResult, qty:Math.max(1,state.scanResult.qty-1)}}); break;
    case "confirm-scan": {
      const itemInput = document.getElementById("scanItemInput");
      const finalItem = itemInput ? itemInput.value : state.scanResult.item;
      const entry = {...state.scanResult, item:finalItem};
      setState({inventory:[...state.inventory, entry], screen:"impact", scanStage:"capture", scanImage:null, scanResult:null});
      showToast(`Added ${entry.qty} ${entry.unit} of ${entry.item} to your inventory`);
      break;
    }
    case "donate-inv": { const entry = state.inventory[parseInt(val)]; showToast(`Matching ${entry.item} to nearby requests...`); break; }

    // ---- trace ----
    case "open-trace": setState({traceOpen:true, traceVisible:0, traceConcise:true}); break;
    case "close-trace": setState({traceOpen:false, traceVisible:0}); break;
    case "toggle-trace-detail": setState({traceConcise:!state.traceConcise, traceVisible: state.traceConcise?0:traceLog.length}); break;

    // ---- org dashboard demo ----
    case "trigger-evening": setState({eveningStage:1}); break;
    case "confirm-business": setState({eveningStage:2}); break;
    case "accept-surplus": { setState({eveningStage:3}); state.impact.items+=18; showToast("Impact counter updated live"); break; }
    case "prepost": showToast("Request posted — nearby donors are being notified now"); break;

    // ---- post request (bug fix: real confirmation) ----
    case "set-pr-urgency": setState({postRequestForm:{...state.postRequestForm, urgency:val}}); break;
    case "submit-post-request": {
      const f = state.postRequestForm;
      if(!f.item.trim() || !f.qty.trim()){ showToast("Add an item and quantity to post"); return; }
      orgQueue.unshift({id:Date.now(), item:f.item, need:parseInt(f.qty)||1, pledges:0, urgency:f.urgency==="urgent"?"urgent":"ongoing"});
      setState({postRequestSuccess:true});
      break;
    }

    // ---- finance ----
    case "open-finance": setState({financeSheetOpen:true}); break;
    case "close-finance": setState({financeSheetOpen:false}); break;
    case "fin-inc": setState({financeAmount:state.financeAmount+5}); break;
    case "fin-dec": setState({financeAmount:Math.max(5,state.financeAmount-5)}); break;
    case "confirm-finance": {
      showToast(`$${state.financeAmount} donated securely — thank you!`);
      setState({financeSheetOpen:false});
      break;
    }
  }
}

render();
</script>
</body>
</html>
